name: Update FABRIC schedule from Gmail

# Lee Gmail (solo lectura, credenciales propias del usuario via secretos),
# importa la sabana de FABRIC de forma deterministas y, SOLO si pasa todas
# las comprobaciones (horas validas, sin solapamientos, no pisa una
# definitiva con una provisional, y pasa el esquema del repo), hace commit
# y push DIRECTO a main. Si cualquier cosa es ambigua o falla, el job
# termina en error, no se escribe ni se publica nada -- el horario
# publicado anterior se queda intacto.
#
# Nota: esto publica sin revision humana previa (a peticion expresa del
# usuario). La red de seguridad es exclusivamente automatica: los
# checks deterministas de pipeline.py/merge_schedule.py y la validacion
# de esquema de abajo. Revisa el horario ya publicado despues de cada
# ejecucion.

on:
  schedule:
    - cron: "0 6 * * *"   # una vez al dia; ajustar si se necesita mas frecuencia
  workflow_dispatch: {}     # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: update-fabric
  cancel-in-progress: false  # nunca cancelar a mitad de una escritura

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Ejecutar el pipeline (Gmail -> importar -> fusionar)
        id: pipeline
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python -m scripts.pipeline 2>&1 | tee pipeline_output.log
          echo "cambios=$(git status --porcelain data/fstf-2627.json data/.sabanas_procesadas.json | wc -l)" >> "$GITHUB_OUTPUT"
        # No se usa "::add-mask::" aqui porque los secretos nunca se
        # imprimen: gmail_fetch.py los lee de variables de entorno y no los
        # vuelve a mostrar en ningun print ni excepcion.

      - name: Validar el esquema tras la fusion (ultima barrera antes de publicar)
        if: steps.pipeline.outputs.cambios != '0'
        run: npm run validate-schedules

      - name: Publicar directamente en main
        if: steps.pipeline.outputs.cambios != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fstf-2627.json data/.sabanas_procesadas.json
          git commit -m "Actualizar data/fstf-2627.json desde la sabana de Gmail"
          git push origin HEAD:main

      - name: Subir el log del pipeline como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log
          path: pipeline_output.log
          retention-days: 30
