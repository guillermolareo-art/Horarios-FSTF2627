name: Update FABRIC schedule from Gmail

# Lee Gmail (solo lectura, credenciales propias del usuario via secretos),
# importa la sabana de FABRIC de forma deterministas y, SOLO si pasa todas
# las comprobaciones (horas validas, sin solapamientos, no pisa una
# definitiva con una provisional, y pasa el esquema del repo), hace commit
# y push DIRECTO a main. Si cualquier cosa es ambigua o falla, el job
# termina en error, no se escribe ni se publica nada -- el horario
# publicado anterior se queda intacto.
#
# Nota: esto publica sin revision humana previa (a peticion expresa del
# usuario). La red de seguridad es exclusivamente automatica: los
# checks deterministas de pipeline.py/merge_schedule.py y la validacion
# de esquema de abajo. Revisa el horario ya publicado despues de cada
# ejecucion.

on:
  schedule:
    - cron: "20 6-20 * * 1-5" # cada hora; pipeline.py filtra la ventana de Europe/Madrid
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-fabric
  cancel-in-progress: false  # nunca cancelar a mitad de una escritura

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Ejecutar el pipeline (Gmail -> importar -> fusionar)
        id: pipeline
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SCHEDULE_OWNER_ID: ${{ secrets.SCHEDULE_OWNER_ID }}
        run: |
          python -m scripts.pipeline
          echo "cambios=$(git status --porcelain data/fstf-2627.json data/.sabanas_procesadas.json | wc -l)" >> "$GITHUB_OUTPUT"
          echo "horario_cambiado=$(git status --porcelain data/fstf-2627.json | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Validar el esquema tras la fusion (ultima barrera antes de publicar)
        if: steps.pipeline.outputs.cambios != '0'
        run: npm run validate-schedules

      - name: Publicar directamente en main
        id: publish
        if: steps.pipeline.outputs.cambios != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fstf-2627.json data/.sabanas_procesadas.json
          git commit -m "Actualizar data/fstf-2627.json desde la sabana de Gmail"
          git push origin HEAD:main

      - name: Comprobar salidas pendientes en Drive
        id: drive-plan
        if: steps.pipeline.outputs.dentro_ventana == 'true' && vars.ENABLE_DRIVE_SYNC == 'true'
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CONTROL_OWNER_LABEL: ${{ secrets.CONTROL_OWNER_LABEL }}
          SCHEDULE_OWNER_ID: ${{ secrets.SCHEDULE_OWNER_ID }}
        run: python -m scripts.drive_task plan

      - name: Instalar Chromium para generar el PDF semanal
        if: steps.drive-plan.outputs.pdf_needed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Sincronizar PDF y Excel con Drive
        if: steps.drive-plan.outputs.pdf_needed == 'true' || steps.drive-plan.outputs.excel_needed == 'true'
        env:
          DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.DRIVE_SERVICE_ACCOUNT_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          CONTROL_OWNER_LABEL: ${{ secrets.CONTROL_OWNER_LABEL }}
          SCHEDULE_OWNER_ID: ${{ secrets.SCHEDULE_OWNER_ID }}
        run: |
          if [ "${{ steps.drive-plan.outputs.pdf_needed }}" = "true" ]; then
            python -m http.server 8000 > /tmp/fstf-http.log 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
            for attempt in {1..20}; do
              if curl --fail --silent http://127.0.0.1:8000/artifact.html > /dev/null; then
                break
              fi
              sleep 1
            done
            curl --fail --silent http://127.0.0.1:8000/artifact.html > /dev/null
          fi
          python -m scripts.drive_task sync

      - name: Notificar nueva sábana en ntfy
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && steps.pipeline.outputs.sabana_aplicada == 'true' && steps.pipeline.outputs.horario_cambiado != '0' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [[ ! "$NTFY_TOPIC" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::NTFY_TOPIC falta o tiene un formato no permitido."
            exit 1
          fi
          AUTH_HEADER=()
          if [[ -n "$NTFY_TOKEN" ]]; then
            AUTH_HEADER=(--header "Authorization: Bearer ${NTFY_TOKEN}")
          fi
          curl --fail-with-body --silent --show-error --max-time 20 \
            --request POST \
            "${AUTH_HEADER[@]}" \
            --header "Title: Nueva sábana FABRIC publicada" \
            --data "Se ha publicado una nueva sábana. Consulta el horario actualizado en GitHub Pages." \
            "https://ntfy.sh/${NTFY_TOPIC}"
