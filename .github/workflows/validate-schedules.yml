name: Validate schedule data

on:
  pull_request:
    paths:
      - "artifact.html"
      - "config/**"
      - "data/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-schedules.yml"
  push:
    branches: [main]
    paths:
      - "artifact.html"
      - "config/**"
      - "data/**"
      - "js/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/validate-schedules.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run validate-schedules
