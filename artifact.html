<style>
:root{
  --bg:#f6f7f6; --surface:#ffffff; --ink:#1b2430; --muted:#5c6773;
  --border:#e1e4e2; --accent:#2e6f6e; --accent-ink:#ffffff;
  --accent-soft:#e4f0ef; --seminario:#a8632c; --seminario-soft:#f6ead9;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161a; --surface:#1a1f24; --ink:#e8ebec; --muted:#8b96a1;
    --border:#2a3238; --accent:#59b3ab; --accent-ink:#0d1a19;
    --accent-soft:#173330; --seminario:#e0a15a; --seminario-soft:#3a2c19;
    --lab:#8fa8e0; --lab-soft:#1f2a40;
    --now-ring:#59b3ab; --warn:#e0a15a; --warn-soft:#3a2c19;
  }
}
:root[data-theme="dark"]{
  --bg:#12161a; --surface:#1a1f24; --ink:#e8ebec; --muted:#8b96a1;
  --border:#2a3238; --accent:#59b3ab; --accent-ink:#0d1a19;
  --accent-soft:#173330; --seminario:#e0a15a; --seminario-soft:#3a2c19;
  --lab:#8fa8e0; --lab-soft:#1f2a40;
  --now-ring:#59b3ab; --warn:#e0a15a; --warn-soft:#3a2c19;
}
*{box-sizing:border-box;}
html,body{max-width:100%;overflow-x:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:"Libre Franklin",system-ui,sans-serif;text-wrap:balance;margin:0;}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums;}

.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}

header{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em;}
.subtitle{color:var(--muted);font-size:13.5px;}

.meta-top{
  display:flex;flex-wrap:wrap;gap:4px 14px;
  font-size:11.5px;color:var(--muted);margin-bottom:16px;
  padding-bottom:12px;border-bottom:1px solid var(--border);
}
.meta-top span{white-space:nowrap;}
.meta-top b{color:var(--ink);font-weight:600;}

/* Pestañas semana actual / próxima semana (provisional) */
.week-tabs{display:flex;gap:6px;margin-bottom:14px;}
.week-tabs button{
  flex:1 1 auto;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
  background:var(--surface);color:var(--muted);border:1px solid var(--border);
  border-radius:9px;padding:8px 10px;transition:.15s ease;
}
.week-tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.week-tabs button .tag{
  display:inline-block;margin-left:5px;font-size:9.5px;font-weight:700;letter-spacing:.03em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;
  background:var(--warn-soft);color:var(--warn);vertical-align:1px;
}
.week-tabs button.active .tag{background:rgba(255,255,255,.25);color:inherit;}

.provisional-banner{
  display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--warn);
  background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;
  padding:8px 11px;margin-bottom:14px;
}

nav.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;-webkit-overflow-scrolling:touch;}
nav.days a{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:999px;
  text-decoration:none;scroll-snap-align:start;}
nav.days a:hover{color:var(--ink);}

.day{margin-bottom:22px;}
.day h2{font-size:16px;font-weight:800;margin-bottom:8px;padding-top:6px;}
.day h2 .count{color:var(--muted);font-weight:500;font-size:12.5px;margin-left:6px;}

/* Tarjeta de clase: layout apilado, sin partir palabras.
   Fila 1: hora (izq) + aula (der, ancho libre). Fila 2: tipo + grupos (envuelve por espacios). */
.slot{
  display:flex;flex-direction:column;gap:6px;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:11px 12px;margin-bottom:8px;position:relative;
  max-width:100%;
  transition:opacity .2s ease;
}
.slot-row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.slot .t{font-size:14px;line-height:1.2;color:var(--ink);white-space:nowrap;font-weight:600;}
.slot .t .end{color:var(--muted);font-weight:400;}
.slot .t .end::before{content:" – ";}
.slot .room{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;flex:0 0 auto;}
.slot .room b{color:var(--ink);font-weight:700;}
.slot .g{font-size:13.5px;line-height:1.4;}
.slot .g .badge{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;margin-right:6px;vertical-align:1px;
}
.badge.teoria{background:var(--accent-soft);color:var(--accent);}
.badge.seminario{background:var(--seminario-soft);color:var(--seminario);}
.badge.laboratorio{background:var(--lab-soft);color:var(--lab);}

/* Clase ya pasada: se difumina para dar prioridad visual a lo que queda por venir */
.slot.is-past{opacity:.4;}
.slot.is-past .badge{background:transparent;color:var(--muted);}

/* Clase en curso ahora mismo */
.slot.is-now{box-shadow:0 0 0 2px var(--now-ring) inset;}

/* Próxima clase: la que viene justo después de "ahora" */
.slot.is-next{
  border-color:var(--accent);
  border-left-width:4px;
  background:var(--accent-soft);
}
.slot.is-next .t{color:var(--accent);}
.next-tag{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;
  letter-spacing:.06em;color:var(--accent);margin-bottom:5px;
}

.week-history{margin-bottom:22px;}
.week-history h3{
  font-size:13px;font-weight:700;color:var(--ink);
  padding:8px 0 4px;
}
.week-history-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:6px;}
.week-history table{width:100%;min-width:230px;border-collapse:collapse;font-size:12.5px;}
.week-history th,.week-history td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.week-history th:not(:first-child),.week-history td.num{text-align:center;}
.week-history th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
.week-history td.num{text-align:center;font-variant-numeric:tabular-nums;}
.week-history tr.current td{font-weight:700;color:var(--accent);}
.week-history tr.current{background:var(--accent-soft);}
.week-history tr.upcoming td{font-weight:600;color:var(--warn);font-style:italic;}
.week-history tr.upcoming{background:var(--warn-soft);}

footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--border);
  font-size:11.5px;color:var(--muted);}

#print-sheet{display:none;}

@page{ size: A4; margin: 10mm; }
@media print{
  html,body{overflow:visible !important;height:99% !important;width:190mm !important;max-width:190mm !important;}
  body{background:#fff;}
  .wrap{max-width:190mm !important;width:190mm !important;margin:0 !important;padding:0 !important;}
  #print-sheet{width:190mm !important;page-break-after:avoid;break-after:avoid;}
  #print-sheet .summary{width:190mm !important;page-break-inside:avoid;break-inside:avoid;page-break-after:avoid;break-after:avoid;}
  header{display:none !important;}
  .meta-top{display:none !important;}
  .week-tabs, .provisional-banner{display:none !important;}
  nav.days, #days{display:none !important;}
  .week-history{display:none !important;}
  #print-sheet{display:block;}
  #print-sheet table{width:100%;border-collapse:collapse;font-size:14px;}
  #print-sheet caption{text-align:left;font-family:"Libre Franklin",sans-serif;font-weight:800;font-size:17px;margin-bottom:8px;color:#1b2430;}
  #print-sheet th,#print-sheet td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top;}
  #print-sheet td.dia-cell{vertical-align:middle;font-weight:700;border-right:2px solid #999;}
  #print-sheet .hora-borde{font-weight:800;font-size:1.25em;}
  #print-sheet th{background:#1b2430 !important;color:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;}
  #print-sheet .summary{margin-top:0;}
  #print-sheet .summary table{width:100%;table-layout:fixed;}
  #print-sheet .summary td:empty{border-color:transparent;}
  #print-sheet .meta{font-size:12px;color:#555;margin-bottom:12px;}
  footer{display:none !important;}

  /* Solo se imprime la tabla resumen transpuesta (días en columnas, primera/última hora
     resaltadas): es una tabla pensada para tener en casa y ver de un vistazo cómo va el
     horario. La tabla detallada (.detail-table) NO se imprime — se oculta siempre en impresión.
     Se imprime siempre vía el propio Share→Imprimir del navegador (no hay botón en la página:
     el Artifact se sirve en un iframe con sandbox que bloquea window.print/open/alert). */
  #print-sheet .detail-table{display:none !important;}
}

const DIAS_ORDEN = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

function toMinutes(hhmm){ const [h,m] = hhmm.split(":").map(Number); return h*60+m; }

// Muestra solo el código de grupo (G1, IM1, SOPHIE…), sin el paréntesis de curso/itinerario
function shortGroup(grupos){
  return grupos.split(",").map(g => g.replace(/\s*\([^)]*\)\s*/g, "").trim()).join(", ");
}

// Extrae el código de semana del nombre de archivo de la sábana (ej. "SABANA_20260904_2B_FINAL.xlsm" -> "2B")
function extraerSemana(archivo){
  // Busca el código corto de semana (1-2 dígitos + letra, ej. "2B", "10A"), NO la fecha larga (8 dígitos) del nombre de archivo
  const m = (archivo||"").match(/_(\d{1,2}[A-Za-z])_/);
  return m ? m[1] : (archivo || "?");
}

// Cuenta clases por tipo dentro de una lista de clases
function contarPorTipo(clases){
  const c = {teoria:0, seminario:0, laboratorio:0};
  clases.forEach(cl => {
    const tu = cl.tipo.toUpperCase();
    const key = tu.startsWith("SEM") ? "seminario" : tu.startsWith("LAB") ? "laboratorio" : "teoria";
    c[key]++;
  });
  return c;
}

let vista = "actual"; // "actual" | "proxima"

function renderTabs(){
  const tabs = document.getElementById("week-tabs");
  const proxima = DATA.proximaSemana;
  if(!proxima || !Array.isArray(proxima.clases) || !proxima.clases.length){
    tabs.hidden = true; tabs.innerHTML = ""; return;
  }
  tabs.hidden = false;
  const semanaActual = extraerSemana(DATA.archivo);
  const semanaProxima = extraerSemana(proxima.archivo);
  tabs.innerHTML = `
    <button type="button" data-vista="actual" class="${vista==="actual"?"active":""}">Semana actual · ${semanaActual}</button>
    <button type="button" data-vista="proxima" class="${vista==="proxima"?"active":""}">Semana ${semanaProxima}${proxima.provisional ? '<span class="tag">Provisional</span>' : ""}</button>`;
  tabs.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { vista = btn.dataset.vista; render(DATA); });
  });
}

function render(data){
  document.getElementById("checked-label").textContent = data.comprobado || data.actualizado;

  renderTabs();

  const viendoProxima = vista === "proxima" && data.proximaSemana && data.proximaSemana.clases && data.proximaSemana.clases.length;
  const activa = viendoProxima ? data.proximaSemana : data;
  document.getElementById("source-label").textContent = activa.archivo;
  document.getElementById("updated-label").textContent = activa.actualizado;

  const banner = document.getElementById("provisional-banner");
  if(viendoProxima && activa.provisional){
    banner.hidden = false;
    banner.textContent = "Sábana provisional: puede sufrir cambios antes de que llegue esta semana.";
  } else {
    banner.hidden = true; banner.textContent = "";
  }

  const byDay = {};
  activa.clases.forEach(c => { (byDay[c.dia] ||= []).push(c); });
  const dias = DIAS_ORDEN.filter(d => byDay[d]);
  dias.forEach(d => byDay[d].sort((a,b)=>toMinutes(a.inicio)-toMinutes(b.inicio)));

  const nav = document.getElementById("day-nav");
  const daysEl = document.getElementById("days");
  nav.innerHTML = ""; daysEl.innerHTML = "";

  const now = new Date();
  const nowDow = DIAS_ORDEN[(now.getDay()+6)%7]; // lunes=0
  const nowMin = now.getHours()*60 + now.getMinutes();
  const curIdx = DIAS_ORDEN.indexOf(nowDow);

  document.getElementById("week-label").textContent = viendoProxima
    ? (dias.length ? (dias.length + " días con clase — vista previa") : "Sin clases FABRIC esa semana")
    : (dias.length ? (dias.length + " días con clase esta semana") : "Sin clases FABRIC esta semana");

  // Localizar la próxima clase — solo tiene sentido en la vista de la semana actual real,
  // ya que se basa en el día/hora de hoy. En la vista previa de la semana siguiente no se resalta nada por tiempo.
  let next = null;
  if(!viendoProxima){
    dias.forEach(dia => {
      byDay[dia].forEach(c => {
        const dIdx = DIAS_ORDEN.indexOf(dia);
        const isUpcoming = (dIdx===curIdx && toMinutes(c.inicio)>=nowMin) || dIdx>curIdx;
        if(!next && isUpcoming) next = {dia, inicio:c.inicio, fin:c.fin, tipo:c.tipo, grupos:c.grupos, aula:c.aula};
      });
    });
    if(!next && dias.length){
      const primerDia = dias[0];
      const c = byDay[primerDia][0];
      next = {dia:primerDia, inicio:c.inicio, fin:c.fin, tipo:c.tipo, grupos:c.grupos, aula:c.aula};
    }
  }

  // Recuento semanal por tipo de clase (de la semana actual REAL, no de la vista previa) — se muestra en el historial
  const counts = contarPorTipo(data.clases);

  // Historial semanal: semanas pasadas guardadas en DATA.historial + la semana actual real (calculada en vivo)
  // + la vista previa de la semana siguiente (DATA.proximaSemana), si existe, como fila aparte marcada "(provisional)".
  // Esta fila de vista previa NO se guarda en DATA.historial (no es una semana cerrada) y se recalcula en vivo cada vez.
  const semanaActualReal = extraerSemana(data.archivo);
  const historial = Array.isArray(data.historial) ? data.historial : [];
  const historyBody = document.getElementById("week-history-body");
  let filas = historial
    .filter(h => h.semana !== semanaActualReal) // evita duplicar si la actual ya estuviera guardada
    .map(h => `<tr><td>${h.semana}</td><td class="num">${h.teoria||0}</td><td class="num">${h.seminario||0}</td><td class="num">${h.laboratorio||0}</td></tr>`)
    .join("") +
    `<tr class="current"><td>${semanaActualReal} (actual)</td><td class="num">${counts.teoria||0}</td><td class="num">${counts.seminario||0}</td><td class="num">${counts.laboratorio||0}</td></tr>`;
  const proxima = data.proximaSemana;
  if(proxima && Array.isArray(proxima.clases) && proxima.clases.length){
    const semanaProxima = extraerSemana(proxima.archivo);
    const countsProxima = contarPorTipo(proxima.clases);
    const etiqueta = semanaProxima + (proxima.provisional ? " (provisional)" : " (próxima)");
    filas += `<tr class="upcoming"><td>${etiqueta}</td><td class="num">${countsProxima.teoria||0}</td><td class="num">${countsProxima.seminario||0}</td><td class="num">${countsProxima.laboratorio||0}</td></tr>`;
  }
  historyBody.innerHTML = filas;

  dias.forEach(dia => {
    nav.innerHTML += `<a href="#d-${dia}">${dia}</a>`;
    const dIdx = DIAS_ORDEN.indexOf(dia);
    const clases = byDay[dia];
    let html = `<section class="day" id="d-${dia}"><h2>${dia}<span class="count">${clases.length} clase${clases.length>1?"s":""}</span></h2>`;
    clases.forEach(c => {
      const isNow = !viendoProxima && dIdx===curIdx && nowMin>=toMinutes(c.inicio) && nowMin<toMinutes(c.fin);
      const isPast = !viendoProxima && (dIdx<curIdx || (dIdx===curIdx && nowMin>=toMinutes(c.fin)));
      const isNext = !!next && next.dia===dia && next.inicio===c.inicio && next.fin===c.fin;
      const tu = c.tipo.toUpperCase();
      const tipoClass = tu.startsWith("SEM") ? "seminario" : tu.startsWith("LAB") ? "laboratorio" : "teoria";
      const cls = ["slot", isNow?"is-now":"", isPast?"is-past":"", isNext?"is-next":""].filter(Boolean).join(" ");
      html += `
        <div class="${cls}">
          ${isNext ? '<div class="next-tag">PRÓXIMA CLASE</div>' : ""}
          <div class="slot-row1">
            <div class="t mono">${c.inicio}<span class="end">${c.fin}</span></div>
            <div class="room">Aula <b>${c.aula ?? "—"}</b></div>
          </div>
          <div class="g"><span class="badge ${tipoClass}">${c.tipo}</span>${shortGroup(c.grupos)}</div>
        </div>`;
    });
    html += `</section>`;
    daysEl.innerHTML += html;
  });

  const byDayReal = {};
  data.clases.forEach(c => { (byDayReal[c.dia] ||= []).push(c); });
  const diasReal = DIAS_ORDEN.filter(d => byDayReal[d]);
  diasReal.forEach(d => byDayReal[d].sort((a,b)=>toMinutes(a.inicio)-toMinutes(b.inicio)));
  renderPrintSheet(data, diasReal, byDayReal);
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }

function renderPrintSheet(data, dias, byDay){
  // La vista imprimible/PDF siempre refleja la semana actual real (DATA.clases), no la vista previa en pantalla.
  const totalMin = data.clases.reduce((acc,c)=>acc + (toMinutes(c.fin)-toMinutes(c.inicio)), 0);
  const horas = Math.floor(totalMin/60), min = totalMin%60;
  const rows = [];
  dias.forEach(dia => {
    const clases = byDay[dia];
    clases.forEach((c,i) => {
      const isFirst = i===0, isLast = i===clases.length-1;
      rows.push(`
      <tr>
        ${isFirst ? `<td class="dia-cell" rowspan="${clases.length}">${dia}</td>` : ""}
        <td>${isFirst ? `<span class="hora-borde">${c.inicio}</span>` : c.inicio}</td>
        <td>${isLast ? `<span class="hora-borde">${c.fin}</span>` : c.fin}</td>
        <td>${cap(c.tipo)}</td>
        <td>${shortGroup(c.grupos)}</td>
        <td>${c.aula ?? "—"}</td>
      </tr>`);
    });
  });
  // Tabla resumen: días en columnas, horas apiladas por debajo de cada día
  const porDia = dias.map(dia => byDay[dia]);
  const maxFilas = Math.max(...porDia.map(cs => cs.length));
  const summaryHead = `<tr>${dias.map(d=>`<th>${d}</th>`).join("")}</tr>`;
  const summaryRows = Array.from({length: maxFilas}, (_, fila) => {
    const celdas = porDia.map(clases => {
      const c = clases[fila];
      if (!c) return "<td></td>";
      const isFirst = fila===0, isLast = fila===clases.length-1;
      return `<td>${isFirst ? `<span class="hora-borde">${c.inicio}</span>` : c.inicio} - ${isLast ? `<span class="hora-borde">${c.fin}</span>` : c.fin}</td>`;
    });
    return `<tr>${celdas.join("")}</tr>`;
  }).join("");

  document.getElementById("print-sheet").innerHTML = `
    <div class="detail-table">
      <table>
        <caption>Horario FSTF 26-27 · Fundamentos de Sistemas y Tecnologías de Fabricación</caption>
        <thead><tr><th>Día</th><th>Inicio</th><th>Fin</th><th>Tipo</th><th>Grupo(s)</th><th>Aula</th></tr></thead>
        <tbody>${rows.join("")}</tbody>
      </table>
      <div class="meta">Actualizado: ${data.actualizado} · Total: ${data.clases.length} sesiones · ${horas}h ${min?min+"min":""} lectivas</div>
    </div>
    <div class="summary">
      <table>
        <caption>Resumen días y horas</caption>
        <thead>${summaryHead}</thead>
        <tbody>${summaryRows}</tbody>
      </table>
    </div>`;
}

// Impresión: no hay botón en la página (el Artifact se sirve dentro de un iframe con sandbox
// en el visor de claude.ai, y ahí NO funcionan window.print(), window.open() ni alert() —
// bloqueados por el sandbox al faltar allow-modals/allow-popups). Para imprimir, el usuario
// usa el propio icono "Compartir" de su navegador (en Safari, arriba de la pantalla) y elige
// "Imprimir" — eso es una acción del sistema operativo/navegador, no sujeta al sandbox del
// iframe. El CSS de @media print ya deja solo la tabla resumen transpuesta (ver arriba).

render(DATA);

// Al abrir la página, situarse directamente en la próxima clase programada (si la hay),
// para no tener que buscarla manualmente entre los días ya pasados.
requestAnimationFrame(() => {
  const proxima = document.querySelector(".slot.is-next");
  if(proxima) proxima.scrollIntoView({block:"center"});
});
</script>
