<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Horario modular</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <div class="eyebrow" id="subtitle"></div>
      <h1 id="app-title"></h1>
      <div class="subtitle" id="week-label" aria-live="polite"></div>
    </header>

    <section class="input-tools" aria-label="Entradas">
      <label class="input-label" for="schedule-files">Previsualizar horarios JSON</label>
      <input id="schedule-files" type="file" accept="application/json,.json" multiple>
      <label class="select-label" for="schedule-select">Horario</label>
      <select id="schedule-select"></select>
      <button class="reload-button" id="reload-button" type="button">Volver a la versión publicada</button>
      <p class="input-help">La vista previa es temporal y solo aparece en este navegador; no publica cambios. Usa el formato común descrito en README.md.</p>
      <p class="input-error" id="input-error" role="alert" hidden></p>
    </section>

    <div class="meta-top">
      <span>Fuente: <b id="source-label">—</b></span>
      <span>Actualizado: <b id="updated-label">—</b></span>
      <span>Última comprobación: <b id="checked-label">—</b></span>
    </div>
    <div class="week-tabs" id="week-tabs"></div>
    <div class="provisional-banner" id="provisional-banner" hidden></div>
    <section class="week-history" id="week-history">
      <h2>Recuento semanal de horas</h2>
      <div class="week-history-scroll"><table>
        <thead><tr><th>Semana</th><th title="Teoría">T</th><th title="Seminario">SEM</th><th title="Laboratorio">LAB</th></tr></thead>
        <tbody id="week-history-body"></tbody>
      </table></div>
    </section>
    <nav class="days" id="day-nav" aria-label="Ir a un día"></nav>
    <div id="days"></div>
    <div id="print-sheet"></div>
    <footer>Horario modular · generado a partir de datos JSON</footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
